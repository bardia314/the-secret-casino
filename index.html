<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the_secret_casino</title>
<style>
body {
  margin:0;
  padding:0;
  font-family:'Arial',sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}
.header {
  display:flex;
  justify-content: space-between;
  align-items:center;
  padding:10px;
  font-size:18px;
}
.flag {
  font-size: 24px;
}
.page {
  display:none;
  padding:20px;
  text-align:center;
}
button {
  padding:10px 20px;
  margin:10px;
  font-size:16px;
  cursor:pointer;
}
.input-field {
  padding:8px;
  margin:8px;
  font-size:16px;
  width:80%;
}
.back-btn {
  position:absolute;
  top:10px;
  left:10px;
}
.customer-card {
  border:1px solid red;
  padding:10px;
  margin:10px auto;
  max-width:300px;
  text-align:center;
}
canvas {
  position:absolute;
  top:0;
  left:0;
  z-index:-1;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="header">
  <div id="adminPrompt">آیا شما ادمین هستید؟</div>
  <div class="flag">🏴</div>
</div>

<!-- صفحه مشتری -->
<div id="customerPage" class="page">
  <h1>خوش آمدید</h1>
  <p id="boothAddress">طبقه دوم کلاس 904</p>
  <p>ای دی روبیکای فروشگاه: @the_secret_casino</p>
  <p id="boothNumberDisplay">شماره غرفه: 0</p>
</div>

<!-- صفحه ورود ادمین -->
<div id="adminLoginPage" class="page">
  <h2>Admin Login</h2>
  <input id="adminId" class="input-field" placeholder="نام کاربری">
  <input id="adminPass" type="password" class="input-field" placeholder="رمز عبور">
  <br>
  <button onclick="loginAdmin()">ورود</button>
</div>

<!-- صفحه ادمین اصلی -->
<div id="mainAdminPage" class="page">
  <h2>ادمین اصلی</h2>
  <button onclick="showCustomers()">دیدن مشتری‌ها</button>
  <button onclick="registerCustomer()">ثبت مشتری</button>
  <button onclick="setBoothNumber()">شماره غرفه</button>
  <button onclick="logout()">برگشت</button>
</div>

<!-- صفحه ادمین عادی -->
<div id="adminPage" class="page">
  <h2>ادمین</h2>
  <button onclick="showCustomers()">دیدن مشتری‌ها</button>
  <button onclick="registerRevenue()">ثبت درآمد</button>
  <button onclick="logout()">برگشت</button>
  <p>پیج اینستاگرام فقط برای ادمین: <a href="https://instagram.com/the_secret_casino" target="_blank">@the_secret_casino</a></p>
</div>

<script>
// canvas خطوط پیچ در پیچ
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize(){ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; }
window.addEventListener('resize', resize);
resize();

let lines = [];
for(let i=0;i<15;i++){
  lines.push({
    x: Math.random()*w,
    y: Math.random()*h,
    angle: Math.random()*Math.PI*2,
    speed: 0.5+Math.random(),
    amplitude: 20+Math.random()*20,
    frequency: 0.01+Math.random()*0.01,
    phase: Math.random()*Math.PI*2,
    color:'rgba(255,0,0,0.7)'
  });
}

function draw(){
  ctx.clearRect(0,0,w,h);
  lines.forEach(l=>{
    ctx.beginPath();
    for(let y=0;y<h;y+=5){
      let x = l.x + Math.sin(y*l.frequency + l.phase)*l.amplitude;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = l.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    l.phase += 0.02;
  });
  requestAnimationFrame(draw);
}
draw();

// اطلاعات محلی
let boothNumber = localStorage.getItem('boothNumber') || 0;
document.getElementById('boothNumberDisplay').innerText = `شماره غرفه: ${boothNumber}`;
let customers = JSON.parse(localStorage.getItem('customers')||'[]');
let revenue = parseInt(localStorage.getItem('revenue')||'0');
const admins = [
  {id:'01', password:'', role:'secondary'},
  {id:'02', password:'', role:'secondary'},
  {id:'00', password:'3.14159265358979323846264338', role:'main'}
];

// نمایش صفحات
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.style.display='none'); document.getElementById(id).style.display='block'; }

// شروع صفحه
showPage('customerPage');

// ادمین prompt
document.getElementById('adminPrompt').onclick = ()=>{ showPage('adminLoginPage'); };

// ورود ادمین
function loginAdmin(){
  let id = document.getElementById('adminId').value;
  let pass = document.getElementById('adminPass').value;
  let admin = admins.find(a=>a.id===id);
  if(!admin){ alert('نام کاربری اشتباه است'); return;}
  if(admin.id==='00' && pass===admin.password){ showPage('mainAdminPage'); return;}
  if(admin.password===''){ admin.password=pass; showPage('adminPage'); return;}
  if(admin.password===pass){ showPage('adminPage'); return;}
  alert('رمز اشتباه است');
}

// مشتری‌ها
function showCustomers(){
  let list = customers.map(c=>`<div class="customer-card">${c.name} ${c.family}<br>رمز: ${c.code}<br>فعال: ${c.active}</div>`).join('');
  let win = window.open('','_blank','width=400,height=600');
  win.document.write(list);
}

// ثبت مشتری
function registerCustomer(){
  let name = prompt('نام مشتری:');
  let family = prompt('نام خانوادگی:');
  let code = Math.random().toString(36).substring(2,4)+Math.floor(Math.random()*9000+1000);
  customers.push({name,family,code,active:true});
  localStorage.setItem('customers', JSON.stringify(customers));
  alert(`مشتری ثبت شد، رمز: ${code}`);
}

// ثبت درآمد
function registerRevenue(){
  let amount = parseInt(prompt('میزان افزایش درآمد:'));
  if(isNaN(amount)||amount<0){ alert('فقط اعداد مثبت'); return;}
  revenue+=amount;
  localStorage.setItem('revenue', revenue);
  alert(`درآمد فعلی: ${revenue}`);
}

// شماره غرفه
function setBoothNumber(){
  let num = prompt('شماره غرفه جدید:');
  if(num){ boothNumber=num; localStorage.setItem('boothNumber', num); document.getElementById('boothNumberDisplay').innerText=`شماره غرفه: ${num}`;}
}

// برگشت
function logout(){ showPage('customerPage'); }
</script>
</body>
</html>
