<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>The Secret Casino</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:black; color:white; font-family:sans-serif;}
  #canvas{position:absolute; top:0; left:0; z-index:0;}
  .page{position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; padding:20px; box-sizing:border-box;}
  button{padding:10px 15px; margin:5px; background:red; color:white; border:none; border-radius:5px; cursor:pointer;}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="page" id="customerPage">
  <h1>خوش آمدید به کازینوی امن</h1>
  <p id="boothNumberDisplay"></p>
  <p>آیدی روبیکا: @the_secret_casino</p>
  <p>آدرس غرفه: طبقه دوم کلاس ۹۰۴</p>
  <button id="adminPrompt">Are you an admin?</button>
</div>

<script>
// بک‌گراند متحرک با 11 شکل عجیب و رنگی
const c=document.getElementById('canvas'), ctx=c.getContext('2d');
c.width=window.innerWidth; c.height=window.innerHeight;

class Shape{
  constructor(){
    this.x=Math.random()*c.width;
    this.y=Math.random()*c.height;
    this.size=Math.random()*30+20;
    this.type=Math.floor(Math.random()*11);
    this.color=['red','green','blue','yellow','purple','orange','pink','cyan','lime','magenta','white'][this.type];
    this.corners=[1,3,4,5,6,5,3,4,2,5,6][this.type];
    this.speed=this.corners/2;
    this.angle=Math.random()*Math.PI*2;
  }
  move(){
    this.x+=Math.cos(this.angle)*this.speed;
    this.y+=Math.sin(this.angle)*this.speed;
    if(this.x<0||this.x>c.width) this.angle=Math.PI-this.angle;
    if(this.y<0||this.y>c.height) this.angle=-this.angle;
  }
  draw(){
    ctx.beginPath(); ctx.strokeStyle=this.color; ctx.lineWidth=2;
    if(this.type===0) ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    else if(this.type===1) ctx.rect(this.x-this.size/2,this.y-this.size/2,this.size,this.size);
    else {
      let n=this.corners;
      for(let i=0;i<n;i++){
        let a=i*2*Math.PI/n;
        ctx.lineTo(this.x+this.size*Math.cos(a), this.y+this.size*Math.sin(a));
      }
      ctx.closePath();
    }
    ctx.stroke();
  }
}

let shapes=[]; for(let i=0;i<11;i++) shapes.push(new Shape());

function animate(){
  ctx.clearRect(0,0,c.width,c.height);
  shapes.forEach(s=>{ s.move(); s.draw(); });
  requestAnimationFrame(animate);
}
animate();

// داده‌ها
let boothNumber=localStorage.getItem('boothNumber')||0;
document.getElementById('boothNumberDisplay').innerText=`شماره غرفه: ${boothNumber}`;

// دکمه Admin (همیشه رمز اشتباه)
document.getElementById('adminPrompt').onclick=()=>{
  alert('رمز اشتباه است!');
};
</script>
</body>
</html>
