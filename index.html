<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Secret Casino</title>

<style>

body{
    margin:0;
    font-family:sans-serif;
    background:black;
    overflow:hidden;
}

/* صفحات */

.page{
    display:none;
    position:absolute;
    inset:0;
}

.show{
    display:block;
}

/* صفحه خوش آمدید */

#welcome{
    color:red;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    font-weight:bold;
}

/* صفحه اطلاعات */

#info{
    color:#00ffcc;
}

.top{
    position:absolute;
    width:100%;
    top:10px;
    display:flex;
    justify-content:space-between;
    padding:0 15px;
    font-size:18px;
}

.center{
    position:absolute;
    width:100%;
    top:40%;
    text-align:center;
    font-size:22px;
}

.bottom{
    position:absolute;
    bottom:10px;
    width:100%;
    text-align:center;
    color:white;
}

.flag{
    font-size:40px;
}

/* ایموجی باکس */

#box{
    position:absolute;
    inset:0;
    border:2px solid rgba(255,255,255,0.15);
    overflow:hidden;
}

.emoji{
    position:absolute;
    font-size:28px;
    user-select:none;
}

/* ادمین */

#admin{
    color:#00ffcc;
    display:flex;
    justify-content:center;
    align-items:center;
}

.adminBox{
    border:1px solid #00ffcc;
    padding:30px;
    border-radius:10px;
    text-align:center;
}

input{
    margin:10px;
    padding:10px;
    background:black;
    border:1px solid #00ffcc;
    color:white;
}

button{
    padding:10px 20px;
    background:#00ffcc;
    border:none;
    cursor:pointer;
}

#msg{
    margin-top:10px;
    color:yellow;
}

.linkBtn{
    background:none;
    border:none;
    color:#ffcc00;
    font-size:16px;
}

</style>
</head>

<body>

<!-- صفحه خوش آمدید -->

<div id="welcome" class="page show" onclick="openInfo()">
خوش آمدید
</div>


<!-- صفحه اطلاعات -->

<div id="info" class="page">

<div id="box"></div>

<div class="top">
<div>
<button class="linkBtn" onclick="openAdmin()">آیا شما ادمین هستید؟</button>
</div>

<div>
شماره غرفه : <span id="num"></span>
</div>
</div>

<div class="center">
<div class="flag">🏴</div>
<br>
طبقه دوم_کلاس ۹۰۴
</div>

<div class="bottom">
ID Rubika: @the_secret_casino
</div>

</div>


<!-- صفحه ادمین -->

<div id="admin" class="page">

<div class="adminBox">

<h2>ورود ادمین</h2>

<input id="user" placeholder="نام کاربری"><br>
<input id="pass" type="password" placeholder="رمز عبور"><br>

<button onclick="login()">ورود</button>

<div id="msg"></div>

</div>

</div>



<script>

/* تغییر صفحه */

function show(id){

    document.querySelectorAll(".page")
    .forEach(p=>p.classList.remove("show"));

    document.getElementById(id)
    .classList.add("show");
}

function openInfo(){
    show("info");
}

function openAdmin(){
    show("admin");
}


/* شماره غرفه */

document.getElementById("num").innerText =
Math.floor(Math.random()*90+10);


/* لاگین */

function login(){

    let u=document.getElementById("user").value;

    let valid=["01","02","03","04","05","06","07","08","09"];

    if(valid.includes(u)){
        msg.innerText="سایت درحال تکمیل شدن است";
    }else{
        msg.innerText="نام کاربری یا رمز عبور نامعتبر است";
    }
}



/* ایموجی فیزیکی */

const icons=["🦁","☀️","🎲","♠️","♥️","♦️","♣️","💰","🎰"];

const box=document.getElementById("box");

let items=[];

for(let i=0;i<12;i++){

    let el=document.createElement("div");
    el.className="emoji";
    el.innerText=icons[Math.floor(Math.random()*icons.length)];

    box.appendChild(el);

    items.push({
        el:el,
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        vx:0,
        vy:0,
        mass:Math.random()*2+1
    });
}


function update(){

    let w=window.innerWidth;
    let h=window.innerHeight;

    items.forEach(p=>{

        p.vy+=0.15*p.mass;

        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<0){p.x=0;p.vx*=-0.7;}
        if(p.x>w-30){p.x=w-30;p.vx*=-0.7;}

        if(p.y<0){p.y=0;p.vy*=-0.7;}
        if(p.y>h-30){p.y=h-30;p.vy*=-0.7;}

        p.el.style.transform=
        `translate(${p.x}px,${p.y}px)`;

    });

    requestAnimationFrame(update);
}

update();


/* سنسور گوشی */

window.addEventListener("deviceorientation",(e)=>{

    let gx=e.gamma/40;
    let gy=e.beta/40;

    items.forEach(p=>{
        p.vx+=gx/p.mass;
        p.vy+=gy/p.mass;
    });

});

</script>

</body>
</html>
