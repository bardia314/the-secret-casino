<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Secret Casino</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:sans-serif;
overflow:hidden;
}

/* canvas */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* عمومی */
.page{
position:absolute;
width:100%;
height:100%;
z-index:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* بالا سمت چپ */
#adminBtn{
position:fixed;
top:10px;
left:10px;
cursor:pointer;
z-index:3;
}

/* بالا وسط */
#langBtn{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
cursor:pointer;
z-index:3;
}

/* شماره غرفه */
#booth{
position:fixed;
top:10px;
right:10px;
z-index:3;
}

/* پرچم مشکی */
.blackFlag{
position:fixed;
top:0;
right:0;
width:25px;
height:25px;
background:black;
z-index:4;
}

/* متن خوش آمد */
.welcome{
font-size:28px;
cursor:pointer;
margin-bottom:15px;
}

/* آدرس */
.address{
display:none;
font-size:22px;
}

/* آیدی پایین */
.bottomID{
position:fixed;
bottom:5px;
width:100%;
text-align:center;
font-size:14px;
}

/* صفحه ادمین */
#adminPage{
position:fixed;
width:100%;
height:100%;
background:black;
display:none;
z-index:5;
flex-direction:column;
justify-content:center;
align-items:center;
}

input{
padding:10px;
margin:5px;
}

.error{
color:red;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="blackFlag"></div>

<div id="adminBtn">Are you an admin?</div>
<div id="langBtn">فارسی</div>
<div id="booth">Booth Number: 1</div>

<!-- English Page -->
<div class="page" id="enPage">
<div class="welcome" onclick="showAddress('en')">Welcome</div>
<div class="address" id="enAddr">Second Floor - Class 904</div>
</div>

<!-- Persian Page -->
<div class="page" id="faPage" style="display:none;">
<div class="welcome" onclick="showAddress('fa')">خوش آمدید</div>
<div class="address" id="faAddr">طبقه دوم - کلاس ۹۰۴</div>
</div>

<div class="bottomID">@the_secret_casino</div>

<!-- Admin -->
<div id="adminPage">
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<div id="msg" class="error"></div>
<button onclick="checkAdmin()">Login</button>
<button onclick="closeAdmin()">Back</button>
</div>

<script>

/* زبان */
langBtn.onclick=()=>{
if(faPage.style.display==="none"){
faPage.style.display="flex"
enPage.style.display="none"
langBtn.innerText="English"
}else{
faPage.style.display="none"
enPage.style.display="flex"
langBtn.innerText="فارسی"
}
}

/* خوش آمد */
function showAddress(lang){
if(lang==="en") enAddr.style.display="block"
else faAddr.style.display="block"
}

/* Admin */
adminBtn.onclick=()=>{
adminPage.style.display="flex"
}

function closeAdmin(){
adminPage.style.display="none"
}

function checkAdmin(){
let valid=["01","02","03","04","05","06","07","08","09"]
if(valid.includes(user.value))
msg.innerText="Wrong password"
else
msg.innerText="Invalid username"
}

/* بک گراند قبلی */
const c=document.getElementById('bg')
const ctx=c.getContext('2d')
c.width=innerWidth
c.height=innerHeight

class Shape{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.size=Math.random()*30+20
this.type=Math.floor(Math.random()*11)
this.color=['red','green','blue','yellow','purple','orange','pink','cyan','lime','magenta','white'][this.type]
this.corners=[1,3,4,5,6,5,3,4,2,5,6][this.type]
this.speed=this.corners/2
this.angle=Math.random()*Math.PI*2
}
move(){
this.x+=Math.cos(this.angle)*this.speed
this.y+=Math.sin(this.angle)*this.speed
if(this.x<0||this.x>c.width) this.angle=Math.PI-this.angle
if(this.y<0||this.y>c.height) this.angle=-this.angle
}
draw(){
ctx.beginPath()
ctx.strokeStyle=this.color
ctx.lineWidth=2
ctx.arc(this.x,this.y,this.size,0,Math.PI*2)
ctx.stroke()
}
}

let shapes=[]
for(let i=0;i<11;i++) shapes.push(new Shape())

function animate(){
ctx.clearRect(0,0,c.width,c.height)
shapes.forEach(s=>{
s.move()
s.draw()
})
requestAnimationFrame(animate)
}
animate()

</script>

</body>
</html></head>

<body>

<canvas id="bg"></canvas>

<div class="blackFlag"></div>

<div id="booth">شماره غرفه: 1</div>
<div id="adminBtn">Are you an admin?</div>

<div class="content">
<div id="welcome">خوش آمدید</div>
<div id="address">طبقه دوم _ کلاس ۹۰۴</div>
</div>

<div id="id">@the_secret_casino</div>

<!-- صفحه ادمین -->
<div id="adminPage">
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<div id="msg" class="error"></div>
<button onclick="checkAdmin()">Login</button>
<button onclick="closeAdmin()">Back</button>
</div>

<script>

/* خوش آمدید */
welcome.onclick=()=>{
address.style.display="block"
}

/* باز شدن صفحه ادمین */
adminBtn.onclick=()=>{
adminPage.style.display="flex"
}

/* بستن */
function closeAdmin(){
adminPage.style.display="none"
}

/* چک ادمین */
function checkAdmin(){
let u=user.value
let valid=["01","02","03","04","05","06","07","08","09"]

if(valid.includes(u))
msg.innerText="رمز اشتباه است"
else
msg.innerText="یوزرنیم معتبر نیست"
}

/* بک گراند متحرک */
const c=document.getElementById("bg")
const ctx=c.getContext("2d")
c.width=innerWidth
c.height=innerHeight

class Shape{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.s=20+Math.random()*20
this.vx=Math.random()*2-1
this.vy=Math.random()*2-1
this.color=`hsl(${Math.random()*360},80%,50%)`
}
move(){
this.x+=this.vx
this.y+=this.vy
if(this.x<0||this.x>c.width) this.vx*=-1
if(this.y<0||this.y>c.height) this.vy*=-1
}
draw(){
ctx.strokeStyle=this.color
ctx.beginPath()
ctx.arc(this.x,this.y,this.s,0,6.28)
ctx.stroke()
}
}

let shapes=[]
for(let i=0;i<11;i++) shapes.push(new Shape())

function animate(){
ctx.clearRect(0,0,c.width,c.height)
shapes.forEach(s=>{
s.move()
s.draw()
})
requestAnimationFrame(animate)
}
animate()

/* پرچم شاهنشاهی شناور ساده */
class Flag{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.vx=0.5
this.vy=0.5
}
move(){
this.x+=this.vx
this.y+=this.vy
if(this.x<0||this.x>c.width) this.vx*=-1
if(this.y<0||this.y>c.height) this.vy*=-1
}
draw(){
ctx.fillStyle="green"
ctx.fillRect(this.x,this.y,15,5)
ctx.fillStyle="white"
ctx.fillRect(this.x,this.y+5,15,5)
ctx.fillStyle="red"
ctx.fillRect(this.x,this.y+10,15,5)
}
}

let flag=new Flag()

setInterval(()=>{
flag.move()
flag.draw()
},50)

</script>

</body>
</html>
