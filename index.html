<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:sans-serif;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

.page{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:2;
}

.top{
position:fixed;
z-index:3;
font-size:14px;
cursor:pointer;
}

#adminBtn{top:10px;left:10px;}
#booth{top:10px;right:10px;}
#langBtn{top:10px;left:50%;transform:translateX(-50%);}

.flag{
position:fixed;
top:0;
right:0;
width:25px;
height:25px;
background:black;
z-index:4;
}

.welcome{font-size:28px;cursor:pointer;}
.addr{display:none;font-size:22px;}

.bottom{
position:fixed;
bottom:5px;
width:100%;
text-align:center;
font-size:13px;
z-index:3;
}

#adminPage{
position:fixed;
width:100%;
height:100%;
background:black;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:5;
}

input{padding:8px;margin:5px;}
.error{color:red;}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="flag"></div>

<div id="adminBtn" class="top"></div>
<div id="langBtn" class="top"></div>
<div id="booth" class="top"></div>

<!-- English -->
<div class="page" id="en">
<div class="welcome" onclick="showAddr('enAddr')" id="welcomeEn"></div>
<div id="enAddr" class="addr"></div>
</div>

<!-- Persian -->
<div class="page" id="fa" style="display:none">
<div class="welcome" onclick="showAddr('faAddr')" id="welcomeFa"></div>
<div id="faAddr" class="addr"></div>
</div>

<div class="bottom">@the_secret_casino</div>

<!-- Admin -->
<div id="adminPage">
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<div id="msg" class="error"></div>
<button onclick="checkAdmin()">Login</button>
<button onclick="closeAdmin()">Back</button>
</div>

<script>

/* ===== زبان ===== */

let lang="en"

const text={
en:{
admin:"Are you an admin?",
booth:"Booth Number",
welcome:"Welcome",
addr:"Second Floor - Class 904",
langBtn:"فارسی"
},
fa:{
admin:"آیا شما ادمین هستید؟",
booth:"شماره غرفه",
welcome:"خوش آمدید",
addr:"طبقه دوم - کلاس ۹۰۴",
langBtn:"English"
}
}

function updateLang(){

adminBtn.innerText=text[lang].admin
booth.innerText=text[lang].booth+" : 1"
langBtn.innerText=text[lang].langBtn

welcomeEn.innerText=text.en.welcome
enAddr.innerText=text.en.addr

welcomeFa.innerText=text.fa.welcome
faAddr.innerText=text.fa.addr

if(lang==="en"){
en.style.display="flex"
fa.style.display="none"
}else{
fa.style.display="flex"
en.style.display="none"
}
}

langBtn.onclick=()=>{
lang = lang==="en" ? "fa" : "en"
updateLang()
}

updateLang()

/* خوش آمد */
function showAddr(id){
document.getElementById(id).style.display="block"
}

/* ===== Admin ===== */

adminBtn.onclick=()=>adminPage.style.display="flex"

function closeAdmin(){
adminPage.style.display="none"
user.value=""
pass.value=""
msg.innerText=""
}

function checkAdmin(){
let valid=["01","02","03","04","05","06","07","08","09"]

if(valid.includes(user.value))
msg.innerText="Wrong password"
else
msg.innerText="Invalid username"
}

/* ===== بک گراند ===== */

const c=document.getElementById("bg")
const ctx=c.getContext("2d")

function resize(){
c.width=innerWidth
c.height=innerHeight
}
resize()
window.onresize=resize

class Shape{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.size=Math.random()*25+15
this.corners=Math.floor(Math.random()*6)+1
this.speed=this.corners/2
this.angle=Math.random()*Math.PI*2
this.color=`hsl(${Math.random()*360},80%,60%)`
}

move(){
this.x+=Math.cos(this.angle)*this.speed
this.y+=Math.sin(this.angle)*this.speed

if(this.x<0||this.x>c.width) this.angle=Math.PI-this.angle
if(this.y<0||this.y>c.height) this.angle=-this.angle
}

draw(){
ctx.beginPath()
ctx.arc(this.x,this.y,this.size,0,Math.PI*2)
ctx.strokeStyle=this.color
ctx.stroke()
}
}

let shapes=[]
for(let i=0;i<11;i++) shapes.push(new Shape())

function animate(){
ctx.clearRect(0,0,c.width,c.height)
shapes.forEach(s=>{
s.move()
s.draw()
})
requestAnimationFrame(animate)
}
animate()

</script>

</body>
</html>input{
padding:10px;
margin:5px;
}

.error{
color:red;
}
</style>
</head>

<body>

<div id="adminBtn">Are you an admin?</div>

<div class="content">
<div id="welcome">خوش آمدید</div>
<div id="address">طبقه دوم _ کلاس ۹۰۴</div>
</div>

<div id="id">@the_secret_casino</div>

<!-- صفحه ادمین -->
<div id="adminPage">
<input id="user" placeholder="Username">
<input id="pass" placeholder="Password" type="password">
<div id="msg" class="error"></div>
<button onclick="checkAdmin()">Login</button>
<button onclick="closeAdmin()">Back</button>
</div>

<script>

/* خوش آمدید */
welcome.onclick=()=>{
address.style.display="block"
}

/* باز شدن صفحه ادمین */
adminBtn.onclick=()=>{
adminPage.style.display="flex"
}

/* بستن */
function closeAdmin(){
adminPage.style.display="none"
}

/* چک ادمین */
function checkAdmin(){
let u=user.value
let valid=["01","02","03","04","05","06","07","08","09"]

if(valid.includes(u))
msg.innerText="رمز اشتباه است"
else
msg.innerText="یوزرنیم معتبر نیست"
}

/* بک گراند متحرک */
const c=document.getElementById("bg")
const ctx=c.getContext("2d")
c.width=innerWidth
c.height=innerHeight

class Shape{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.s=20+Math.random()*20
this.vx=Math.random()*2-1
this.vy=Math.random()*2-1
this.color=`hsl(${Math.random()*360},80%,50%)`
}
move(){
this.x+=this.vx
this.y+=this.vy
if(this.x<0||this.x>c.width) this.vx*=-1
if(this.y<0||this.y>c.height) this.vy*=-1
}
draw(){
ctx.strokeStyle=this.color
ctx.beginPath()
ctx.arc(this.x,this.y,this.s,0,6.28)
ctx.stroke()
}
}

let shapes=[]
for(let i=0;i<11;i++) shapes.push(new Shape())

function animate(){
ctx.clearRect(0,0,c.width,c.height)
shapes.forEach(s=>{
s.move()
s.draw()
})
requestAnimationFrame(animate)
}
animate()

/* پرچم شاهنشاهی شناور ساده */
class Flag{
constructor(){
this.x=Math.random()*c.width
this.y=Math.random()*c.height
this.vx=0.5
this.vy=0.5
}
move(){
this.x+=this.vx
this.y+=this.vy
if(this.x<0||this.x>c.width) this.vx*=-1
if(this.y<0||this.y>c.height) this.vy*=-1
}
draw(){
ctx.fillStyle="green"
ctx.fillRect(this.x,this.y,15,5)
ctx.fillStyle="white"
ctx.fillRect(this.x,this.y+5,15,5)
ctx.fillStyle="red"
ctx.fillRect(this.x,this.y+10,15,5)
}
}

let flag=new Flag()

setInterval(()=>{
flag.move()
flag.draw()
},50)

</script>
